name: Kontrola oferty
# Sprawdza rekord bieżącego miesiąca w data/months.json z listami emisyjnymi i NBP.
# Niczego nie zmienia; przy rozbieżności przebieg kończy się błędem (GitHub wysyła wtedy e-mail).
on:
  schedule:
    - cron: "17 7 5 * *"   # 5. dnia miesiąca, ok. 8:17–9:17 czasu polskiego (dzień po aktualizacji)
    - cron: "17 7 20 * *"  # 20. dnia: czy szybki szacunek CPI zastąpiono odczytem finalnym
  workflow_dispatch:
    inputs:
      month:
        description: "Miesiąc RRRR-MM (puste = bieżący)"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Instalacja pdftotext
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - name: Kontrola
        run: python3 scripts/check_offer.py "${{ inputs.month }}"
