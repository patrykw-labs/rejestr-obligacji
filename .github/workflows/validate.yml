name: Walidacja danych
on:
  push:
    paths: ["data/**", "scripts/**", "js/**", "index.html"]
  pull_request:
    paths: ["data/**", "scripts/**", "js/**", "index.html"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Testy kalkulatora zamiany
        run: node scripts/test_zamiana.js
