name: Wydanie

# Tworzy wydanie na GitHubie z notatkami z .github/release-notes/vX.Y.Z.md (bez pliku — z notatkami
# wygenerowanymi z listy commitów). Uruchomienie: wypchnięcie tagu vX.Y.Z albo ręcznie (Actions → Wydanie →
# Run workflow, pole „tag”) — wtedy tag powstaje na bieżącym commicie gałęzi main. Najpierw walidacja i testy.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Wersja, np. v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Walidacja danych
        run: python3 scripts/validate.py
      - name: Testy kalkulatora zamiany
        run: node scripts/test_zamiana.js
      - name: Utwórz wydanie
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "Zła wersja: $TAG (oczekiwano vX.Y.Z)"; exit 1;; esac
          NOTES=".github/release-notes/${TAG}.md"
          if [ -f "$NOTES" ]; then SRC=(--notes-file "$NOTES"); else SRC=(--generate-notes); fi
          if [ "${{ github.event_name }}" = "push" ]; then WHERE=(--verify-tag); else WHERE=(--target "$GITHUB_SHA"); fi
          gh release create "$TAG" "${WHERE[@]}" --title "${TAG} – Rejestr ofert obligacji" "${SRC[@]}"
