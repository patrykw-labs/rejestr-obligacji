name: Wydanie

# Tworzy wydanie na GitHubie z notatkami z sekcji „## vX.Y.Z” w CHANGELOG.md (bez sekcji — z notatkami
# wygenerowanymi z listy commitów). Uruchomienie: wypchnięcie tagu vX.Y.Z albo ręcznie (Actions → Wydanie →
# Run workflow, pole „tag”) — wtedy tag powstaje na bieżącym commicie gałęzi main. Najpierw walidacja i testy.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Wersja, np. v1.0.0"
        required: true
      target:
        description: "Commit (SHA) dla tagu; puste = bieżący main. Pliki .github/workflows w tym commicie muszą być takie jak na main (inaczej GitHub odmówi: 403)"
        required: false
      recreate:
        description: "Usuń istniejące wydanie i tag o tej nazwie i utwórz je od nowa (np. po przepisaniu historii)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Walidacja danych
        run: python3 scripts/validate.py
      - name: Wersje plików strony
        run: python3 scripts/assets.py
      - name: Testy kalkulatora zamiany
        run: node scripts/test_zamiana.js
      - name: Utwórz wydanie
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "Zła wersja: $TAG (oczekiwano vX.Y.Z)"; exit 1;; esac
          # sekcja „## vX.Y.Z …” z CHANGELOG.md do następnego nagłówka „## ”
          awk -v t="## ${TAG}" 'index($0,t)==1{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md > /tmp/notes.md
          if [ -s /tmp/notes.md ]; then SRC=(--notes-file /tmp/notes.md); else SRC=(--generate-notes); fi
          if [ "${{ github.event_name }}" = "push" ]; then WHERE=(--verify-tag); else WHERE=(--target "${{ inputs.target || github.sha }}"); fi
          if [ "${{ inputs.recreate }}" = "true" ] && gh release view "$TAG" >/dev/null 2>&1; then gh release delete "$TAG" --cleanup-tag --yes; fi
          if [ "${{ inputs.recreate }}" = "true" ]; then git push origin ":refs/tags/$TAG" 2>/dev/null || true; fi
          gh release create "$TAG" "${WHERE[@]}" --title "${TAG} – Rejestr ofert obligacji" "${SRC[@]}"
